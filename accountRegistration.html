<html>
    <div style="display: flex; justify-content: center;">
        <img src="logo.png" alt="COLLaborate Logo">
    </div>
    <form>
    <!-- 1. Selection element -->
    <label for="school-select">Select your community or school:</label>
    <select id="school-select" name="school" required>
        <option value="" disabled selected>Choose a school...</option>
        <option value="rit">Rochester Institute of Technology</option>
        <option value="roosevelt">Roosevelt University</option>
        <option value="rollins">Rollins College</option>
        <option value="rwu">Roger Williams University</option>
    </select>

    <br><br>

    <!-- 2. Pure HTML context structure -->
    <label for="email-select">Select your email:</label>
    <select id="email-select" name="email_domain" required>
        <option value="" disabled selected>Choose a domain...</option>
        
        <!-- Grouped values allow users to clearly scan and match their selection -->
        <optgroup label="Rochester Institute of Technology">
        <option value="rit.edu">@rit.edu</option>
        </optgroup>
        
        <optgroup label="Roosevelt University">
        <option value="roosevelt.edu">@roosevelt.edu</option>
        </optgroup>
        
        <optgroup label="Rollins College">
        <option value="rollins.edu">@rollins.edu</option>
        </optgroup>
        
        <optgroup label="Roger Williams University">
        <option value="rwu.edu">@rwu.edu</option>
        </optgroup>
    </select>

    <br><br>

    <a href="home.html">
            <button>Verify email (not implemented)</button>
    </a>
    </form>
</html>
