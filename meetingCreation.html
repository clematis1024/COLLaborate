<html>
    <head>
        <title>COLLaborate - Meeting</title>
    </head>

    <style type="text/css">
    button {
        background-color: #4285f4;
        border-radius: 10px;
        padding: 5px;
        min-width: 50px;
    }
    </style>

    <body>

        <div class="logo-container"> 
            <img src="logo.png" alt="COLLaborate Logo"> 
        </div> 

        <form action="groupSchedule.html" method="GET"> 
            <div class="form-group">
                <label for="school-select">Select meeting room:</label> 
                <select id="school-select" name="school" required> 
                    <option value="" disabled selected>Choose a room...</option> 
                    <option value="SWEN">Software Engineering group room</option> 
                    <option value="SHED">Library</option> 
                    <option value="GOL">GOL-2455</option> 
                    <option value="DSP">DSP-1250</option> 
                </select> 
            </div>

            <div class="form-group">
                <label for="time">Meeting Date:</label> 
                <input type="datetime-local" id="time" name="time" required> 
            </div>

            <div class="form-group">
                <label for="duration">Meeting Duration:</label> 
                <input type="number" min="15" max="120" step="5" value="60" id="duration" name="duration" required> minutes
            </div>

            <button type="submit" class="btn">Schedule meeting</button> 
        </form> 

    </body>
</html>
